# Produkcja: SPA (Vite build) + /api/ -> Django.
# Kontener app (project1-app) wisi w sieciach `proxy` i `project1-internal`.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # resolver = Docker embedded DNS; rozwiazuje backend dynamicznie,
    # zeby re-create backendu (nowe IP) nie konczyl sie 502.
    resolver 127.0.0.11 valid=10s;
    set $backend_host project1-backend;

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
